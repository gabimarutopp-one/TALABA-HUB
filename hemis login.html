<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HEMIS - Kirish</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    padding: 20px;
    margin: 0;
  }
  h2 { font-size: 20px; margin-bottom: 4px; }
  p.subtitle {
    color: var(--tg-theme-hint-color, #999999);
    font-size: 14px;
    margin-top: 0;
    margin-bottom: 20px;
  }
  label {
    font-weight: 600;
    margin-top: 14px;
    display: block;
    font-size: 14px;
  }
  input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 10px;
    border: 1px solid var(--tg-theme-hint-color, #cccccc);
    font-size: 16px;
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    color: var(--tg-theme-text-color, #000000);
  }
  .hint { font-size: 12px; color: var(--tg-theme-hint-color, #999999); margin-top: 4px; }
  button {
    width: 100%;
    padding: 14px;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    margin-top: 22px;
    cursor: pointer;
  }
  #error {
    color: #e53935;
    font-size: 14px;
    margin-top: 12px;
    min-height: 18px;
  }
  .lock-note {
    font-size: 12px;
    color: var(--tg-theme-hint-color, #999999);
    margin-top: 18px;
    text-align: center;
  }
</style>
</head>
<body>
  <h2>🎓 HEMIS hisobingizga kiring</h2>
  <p class="subtitle">Ma'lumotlaringiz faqat botga, shifrlangan holda yuboriladi.</p>

  <label>Universitet domeni</label>
  <input id="domain" type="text" placeholder="student.tuit.uz" autocomplete="off" autocapitalize="none">
  <div class="hint">Faqat domen nomi, "https://" yozmang</div>

  <label>Login (talaba ID)</label>
  <input id="login" type="text" placeholder="masalan: 12345678" autocomplete="username" autocapitalize="none">

  <label>Parol</label>
  <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">

  <button onclick="submitForm()">✅ Kirish</button>
  <div id="error"></div>
  <div class="lock-note">🔒 Parolingiz shifrlangan holda saqlanadi</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  function submitForm() {
    const domain = document.getElementById('domain').value.trim();
    const login = document.getElementById('login').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');
    errorEl.textContent = "";

    if (!domain || !login || !password) {
      errorEl.textContent = "Barcha maydonlarni to'ldiring.";
      return;
    }

    const payload = JSON.stringify({
      type: "hemis_login",
      domain: domain,
      login: login,
      password: password
    });

    tg.sendData(payload);
    tg.close();
  }
</script>
</body>
</html>
