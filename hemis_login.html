<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HEMIS Login</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: #0d0f1c;
    color: #fff;
    overflow-x: hidden;
    position: relative;
  }

  /* Animatsiyali fon shar-shar gradient */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    z-index: 0;
    animation: float 10s ease-in-out infinite;
  }
  .blob1 { width: 260px; height: 260px; background: #6d5bff; top: -60px; left: -60px; }
  .blob2 { width: 220px; height: 220px; background: #00d4ff; bottom: -40px; right: -40px; animation-delay: 2s; }
  .blob3 { width: 180px; height: 180px; background: #ff5ba1; top: 40%; right: -60px; animation-delay: 4s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(10px, -20px) scale(1.08); }
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 24px 18px 30px;
    max-width: 440px;
    margin: 0 auto;
  }

  .top-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .top-brand .emoji {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6d5bff, #00d4ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .top-brand .title { font-weight: 800; font-size: 17px; letter-spacing: 0.3px; }
  .top-brand .sub { font-size: 11px; color: #9aa3c7; }

  /* Progress dots */
  .progress {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
  }
  .progress .seg {
    flex: 1;
    height: 5px;
    border-radius: 6px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }
  .progress .seg .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6d5bff, #00d4ff);
    transition: width 0.35s ease;
  }
  .progress .seg.done .fill { width: 100%; }
  .progress .seg.active .fill { width: 100%; }

  .glass-card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 24px;
    padding: 24px 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    min-height: 300px;
    display: flex;
    flex-direction: column;
  }

  .step { display: none; flex-direction: column; flex: 1; }
  .step.active { display: flex; animation: fadein 0.3s ease; }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .step-eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #8ee6ff;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .step-title {
    font-size: 20px;
    font-weight: 800;
    margin: 0 0 4px;
  }
  .step-desc {
    font-size: 13px;
    color: #a6afd1;
    margin: 0 0 20px;
  }

  .pill-option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    margin-bottom: 10px;
    border-radius: 16px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.12);
    color: #fff;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .pill-option:active { transform: scale(0.98); }
  .pill-option.selected {
    background: linear-gradient(90deg, rgba(109,91,255,0.35), rgba(0,212,255,0.2));
    border-color: #8ee6ff;
  }

  .option-list {
    max-height: 300px;
    overflow-y: auto;
    padding-right: 2px;
  }

  input {
    width: 100%;
    padding: 15px 16px;
    border-radius: 16px;
    border: 1.5px solid rgba(255,255,255,0.14);
    font-size: 15px;
    background: rgba(255,255,255,0.05);
    color: #fff;
    margin-bottom: 14px;
  }
  input::placeholder { color: #7d86ab; }
  input:focus { outline: none; border-color: #8ee6ff; }

  .input-icon-wrap { position: relative; }
  .toggle-eye {
    position: absolute;
    right: 14px;
    top: 15px;
    background: none;
    border: none;
    color: #9aa3c7;
    font-size: 17px;
    cursor: pointer;
  }

  .nav-row {
    display: flex;
    gap: 10px;
    margin-top: auto;
    padding-top: 14px;
  }

  .btn {
    flex: 1;
    padding: 15px;
    border-radius: 16px;
    border: none;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .btn-primary {
    background: linear-gradient(90deg, #6d5bff, #00d4ff);
    color: #0d0f1c;
    box-shadow: 0 10px 24px rgba(109,91,255,0.35);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.06);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.14);
    flex: 0 0 90px;
  }
  .btn:disabled { opacity: 0.4; }

  #error {
    color: #ff8fa1;
    font-size: 12.5px;
    text-align: center;
    margin-top: 10px;
    min-height: 0;
  }

  .safe-note {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    font-size: 11.5px;
    color: #8f98bd;
    margin-top: 16px;
    line-height: 1.4;
  }

  .summary-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(142,230,255,0.12);
    border: 1px solid rgba(142,230,255,0.3);
    color: #8ee6ff;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 16px;
    align-self: flex-start;
  }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="page">

  <div class="top-brand">
    <div class="emoji">🎓</div>
    <div>
      <div class="title">HEMIS Ulanish</div>
      <div class="sub">3 ta oddiy qadam</div>
    </div>
  </div>

  <div class="progress">
    <div class="seg" id="seg1"><div class="fill"></div></div>
    <div class="seg" id="seg2"><div class="fill"></div></div>
    <div class="seg" id="seg3"><div class="fill"></div></div>
  </div>

  <div class="glass-card">

    <!-- STEP 1: VILOYAT -->
    <div class="step" id="step1">
      <div class="step-eyebrow">1-qadam</div>
      <div class="step-title">Qaysi hududdasiz?</div>
      <div class="step-desc">Universitetingiz joylashgan viloyatni tanlang</div>
      <div class="option-list" id="regionList"></div>
      <div class="nav-row">
        <button class="btn btn-primary" id="toStep2Btn" disabled onclick="goStep(2)">Davom etish →</button>
      </div>
    </div>

    <!-- STEP 2: UNIVERSITET -->
    <div class="step" id="step2">
      <div class="step-eyebrow">2-qadam</div>
      <div class="step-title">Universitetingiz</div>
      <div class="step-desc" id="regionChosenLabel">Ro'yxatdan tanlang</div>
      <div class="option-list" id="uniList"></div>

      <div id="manualDomainBlock" style="display:none;">
        <div class="input-icon-wrap">
          <input id="manualDomain" type="text" placeholder="🔗 student.masalan.uz" autocomplete="off" autocapitalize="none">
        </div>
      </div>

      <div class="nav-row">
        <button class="btn btn-ghost" onclick="goStep(1)">← Orqaga</button>
        <button class="btn btn-primary" id="toStep3Btn" disabled onclick="goStep(3)">Davom etish →</button>
      </div>
    </div>

    <!-- STEP 3: LOGIN/PAROL -->
    <div class="step" id="step3">
      <div class="step-eyebrow">3-qadam</div>
      <div class="step-title">Kirish ma'lumotlari</div>
      <span class="summary-chip" id="summaryChip">🏛 —</span>

      <input id="login" type="text" placeholder="🆔 Login (talaba ID)" autocomplete="username" autocapitalize="none">
      <div class="input-icon-wrap">
        <input id="password" type="password" placeholder="🔒 Parol" autocomplete="current-password">
        <button type="button" class="toggle-eye" onclick="togglePassword()">👁</button>
      </div>

      <div id="error"></div>

      <div class="nav-row">
        <button class="btn btn-ghost" onclick="goStep(2)">← Orqaga</button>
        <button class="btn btn-primary" onclick="submitForm()">✅ Kirish</button>
      </div>

      <div class="safe-note">
        🛡️ <span>Parolingiz faqat HEMIS serveriga yuboriladi va bot xabarlarida saqlanmaydi.</span>
      </div>
    </div>

  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const DATA = {
    "Toshkent shahri": [
      { name: "TUIT (Toshkent axborot texnologiyalari universiteti)", domain: "student.tuit.uz" },
      { name: "TDTU (Toshkent davlat texnika universiteti)", domain: "student.tdtu.uz" },
      { name: "O'zbekiston Milliy universiteti (NUU)", domain: "student.nuu.uz" },
      { name: "Jahon iqtisodiyoti va diplomatiya universiteti (UWED)", domain: "student.uwed.uz" },
      { name: "Nizomiy nomidagi TDPU", domain: "student.tdpu.uz" },
      { name: "Jamoat xavfsizligi universiteti", domain: "student.mgjxu.uz" },
    ],
    "Andijon viloyati": [
      { name: "Andijon davlat universiteti", domain: "student.adu.uz" },
      { name: "Andijon davlat pedagogika instituti", domain: "student.adpi.uz" },
      { name: "Andijon mashinasozlik instituti", domain: "student.andmiedu.uz" },
    ],
    "Farg'ona viloyati": [
      { name: "Farg'ona davlat universiteti", domain: "student.fdu.uz" },
      { name: "Farg'ona politexnika instituti", domain: "student.ferpi.uz" },
    ],
    "Namangan viloyati": [
      { name: "Namangan davlat universiteti", domain: "student.namdu.uz" },
      { name: "Namangan muhandislik-qurilish instituti", domain: "student.nammqi.uz" },
      { name: "Namangan muhandislik-texnologiya instituti", domain: "student.nammti.uz" },
    ],
    "Samarqand viloyati": [
      { name: "Samarqand davlat universiteti", domain: "student.samdu.uz" },
      { name: "Samarqand davlat arxitektura-qurilish universiteti", domain: "student.samdaqu.edu.uz" },
    ],
    "Jizzax viloyati": [
      { name: "Jizzax davlat pedagogika universiteti", domain: "student.jspi.uz" },
      { name: "Jizzax politexnika instituti", domain: "student.jizpi.uz" },
      { name: "NUU Jizzax filiali", domain: "student.jbnuu.uz" },
    ],
    "Sirdaryo viloyati": [
      { name: "Guliston davlat universiteti", domain: "student.guldu.uz" },
      { name: "Guliston davlat pedagogika instituti", domain: "student.gspi.uz" },
    ],
    "Surxondaryo viloyati": [
      { name: "Termiz davlat universiteti", domain: "student.tersu.uz" },
      { name: "Termiz davlat pedagogika instituti", domain: "student.terdpi.uz" },
      { name: "Termiz Iqtisodiyot va Servis Universiteti (TESU)", domain: "student.tesu.uz" },
    ],
    "Qashqadaryo viloyati": [
      { name: "Shahrisabz davlat pedagogika instituti", domain: "student.shdpi.uz" },
    ],
    "Xorazm viloyati": [
      { name: "Urganch davlat universiteti", domain: "student.urdu.uz" },
    ],
    "Qoraqalpog'iston Respublikasi": [
      { name: "Nukus davlat pedagogika instituti", domain: "student.ndpi.uz" },
      { name: "Qoraqalpog'iston tibbiyot instituti", domain: "student.kkmi.uz" },
    ],
    "Navoiy viloyati": [
      { name: "Navoiy davlat pedagogika instituti", domain: "student.nspi.uz" },
    ],
  };
  const OTHER = "__other__";

  let selectedRegion = null;
  let selectedUniName = null;
  let selectedDomain = null;

  const regionList = document.getElementById('regionList');
  const uniList = document.getElementById('uniList');
  const manualBlock = document.getElementById('manualDomainBlock');
  const manualInput = document.getElementById('manualDomain');
  const toStep2Btn = document.getElementById('toStep2Btn');
  const toStep3Btn = document.getElementById('toStep3Btn');
  const regionChosenLabel = document.getElementById('regionChosenLabel');
  const summaryChip = document.getElementById('summaryChip');

  function renderRegions() {
    regionList.innerHTML = '';
    Object.keys(DATA).sort().forEach(region => {
      const btn = document.createElement('button');
      btn.className = 'pill-option';
      btn.textContent = region;
      btn.onclick = () => selectRegion(region, btn);
      regionList.appendChild(btn);
    });
    const otherBtn = document.createElement('button');
    otherBtn.className = 'pill-option';
    otherBtn.textContent = "🔎 Boshqa / topolmadim";
    otherBtn.onclick = () => selectRegion(OTHER, otherBtn);
    regionList.appendChild(otherBtn);
  }

  function selectRegion(region, btnEl) {
    selectedRegion = region;
    [...regionList.children].forEach(c => c.classList.remove('selected'));
    btnEl.classList.add('selected');
    toStep2Btn.disabled = false;
  }

  function renderUnis() {
    uniList.innerHTML = '';
    manualBlock.style.display = 'none';
    selectedUniName = null;
    selectedDomain = null;
    toStep3Btn.disabled = true;

    if (selectedRegion === OTHER) {
      regionChosenLabel.textContent = "Ro'yxatda yo'q — domenni qo'lda yozing";
      manualBlock.style.display = 'block';
      toStep3Btn.disabled = false;
      return;
    }

    regionChosenLabel.textContent = selectedRegion + " bo'yicha ro'yxat";
    DATA[selectedRegion].forEach(u => {
      const btn = document.createElement('button');
      btn.className = 'pill-option';
      btn.textContent = u.name;
      btn.onclick = () => {
        selectedUniName = u.name;
        selectedDomain = u.domain;
        [...uniList.children].forEach(c => c.classList.remove('selected'));
        btn.classList.add('selected');
        manualBlock.style.display = 'none';
        toStep3Btn.disabled = false;
      };
      uniList.appendChild(btn);
    });

    const otherBtn = document.createElement('button');
    otherBtn.className = 'pill-option';
    otherBtn.textContent = "🔎 Boshqa (ro'yxatda yo'q)";
    otherBtn.onclick = () => {
      selectedUniName = "Boshqa";
      selectedDomain = null;
      [...uniList.children].forEach(c => c.classList.remove('selected'));
      otherBtn.classList.add('selected');
      manualBlock.style.display = 'block';
      toStep3Btn.disabled = false;
    };
    uniList.appendChild(otherBtn);
  }

  function goStep(n) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById('step' + n).classList.add('active');

    ['seg1','seg2','seg3'].forEach((id, idx) => {
      const seg = document.getElementById(id);
      seg.classList.remove('active','done');
      if (idx + 1 < n) seg.classList.add('done');
      if (idx + 1 === n) seg.classList.add('active');
    });

    if (n === 2) renderUnis();
    if (n === 3) {
      const finalDomain = selectedDomain || manualInput.value.trim();
      summaryChip.textContent = "🏛 " + (selectedUniName === "Boshqa" || selectedRegion === OTHER
        ? (manualInput.value.trim() || "domen kiritilmagan")
        : selectedUniName);
    }
  }

  function togglePassword() {
    const pass = document.getElementById('password');
    pass.type = pass.type === 'password' ? 'text' : 'password';
  }

  function submitForm() {
    const errorEl = document.getElementById('error');
    errorEl.textContent = "";

    const domain = selectedDomain || manualInput.value.trim();
    const login = document.getElementById('login').value.trim();
    const password = document.getElementById('password').value;

    if (!domain || !login || !password) {
      errorEl.textContent = "Barcha maydonlarni to'ldiring.";
      return;
    }

    const payload = JSON.stringify({
      type: "hemis_login",
      domain: domain,
      login: login,
      password: password
    });

    tg.sendData(payload);
    tg.close();
  }

  renderRegions();
  goStep(1);
</script>
</body>
</html>
